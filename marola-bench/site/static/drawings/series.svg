<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="An empty chart: a time axis, a score axis and a dashed line for the climatology floor. No series is drawn."><title>The bench today: an empty chart. No series is drawn, because no score has been registered.</title><style>.a{stroke:#EAF2F5;stroke-opacity:.55;stroke-width:1.5;fill:none}.g{stroke:#EAF2F5;stroke-opacity:.14;stroke-width:1;fill:none}.f{stroke:#F2B705;stroke-width:2;stroke-dasharray:3 9;stroke-linecap:round;fill:none}.t{font:400 13px 'IBM Plex Mono',ui-monospace,monospace;fill:#EAF2F5;fill-opacity:.72}.y{fill:#F2B705;fill-opacity:1}</style><path class="g" d="M70 40H940M70 90H940M70 190H940"/><path class="g" d="M215 20V220M360 20V220M505 20V220M650 20V220M795 20V220"/><path class="a" d="M70 20V220H940"/><path class="f" d="M70 140H940"/><text class="t y" x="80" y="131">climatology floor: a forecaster below this line has no skill</text><text class="t" x="70" y="244">time</text><text class="t" x="940" y="244" text-anchor="end">one line for each forecaster, at one point, for one variable and one lead</text><text class="t" x="58" y="26" text-anchor="end">skill</text><circle cx="70" cy="140" r="5" fill="#F2B705"/></svg>
